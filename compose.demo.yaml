services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DEMO_HOST: ${DEMO_HOST:?Set DEMO_HOST to the public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
