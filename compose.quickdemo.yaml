# Keep the public tunnel limited to Nginx and isolate every persistent volume.
services:
  db:
    ports: !override []
  rabbitmq:
    ports: !override []
  api:
    ports: !override []
  identity:
    ports: !override []
  mailpit:
    ports: !override
      - "127.0.0.1:8026:8025"
  web:
    ports: !override
      - "127.0.0.1:5174:80"
