name: Deploy demo
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: >-
      vars.DEMO_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: processmind-demo
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Prepare pinned SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy CI-verified main commit
        env:
          DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          DEMO_HOST: ${{ vars.DEMO_HOST }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          [[ "$DEMO_SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9]$ ]]
          [[ "$DEMO_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEMO_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9]$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEMO_SSH_USER@$DEMO_SSH_HOST" \
            "cd /opt/processmind && bash scripts/deploy_demo.sh $TARGET_SHA $DEMO_HOST"
      - name: Check public HTTPS readiness
        env:
          DEMO_HOST: ${{ vars.DEMO_HOST }}
        run: curl --fail --silent --show-error --max-time 20 "https://$DEMO_HOST/api/v1/health/ready" > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate synthetic full flow on public URL
        working-directory: apps/web
        env:
          E2E_BASE_URL: https://${{ vars.DEMO_HOST }}
        run: npm run test:e2e
