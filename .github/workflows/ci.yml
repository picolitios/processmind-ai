name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: processmind_test
          POSTGRES_USER: processmind
          POSTGRES_PASSWORD: processmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U processmind -d processmind_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://processmind:processmind_test@localhost:5432/processmind_test
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
        working-directory: apps/api
      - run: ruff check .
        working-directory: apps/api
      - run: mypy app
        working-directory: apps/api
      - run: alembic upgrade head
        working-directory: apps/api
      - run: pytest
        working-directory: apps/api
      - run: python ../../scripts/validate_specs.py
        working-directory: apps/api
      - run: python ../../scripts/evaluate_audit.py --sizes 1000 --assert-gates --output-dir /tmp/processmind-eval
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  arm64-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [apps/api, apps/web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 image without publishing
        run: docker buildx build --platform linux/arm64 --progress plain "${{ matrix.image }}"
  demo-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: synthetic-ci-only
      IDENTITY_DB_PASSWORD: synthetic-ci-only
      BUSINESS_DB_PASSWORD: synthetic-ci-only
      DEMO_HOST: demo.example.org
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/bootstrap_demo.sh scripts/deploy_demo.sh scripts/provision_demo_host.sh
      - run: docker compose -f compose.yaml -f compose.demo.yaml config --quiet
      - name: Validate public TLS proxy config
        run: docker run --rm -e DEMO_HOST -v "$PWD/infra/demo/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: processmind_browser_ci
      APP_ENV: local
      WEB_ORIGIN: http://localhost:5173
      E2E_BASE_URL: http://localhost:5173
      OLLAMA_BASE_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Create isolated test credentials
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "IDENTITY_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "BUSINESS_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "AUTH_HASH_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "RABBITMQ_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start database and broker
        run: docker compose up -d --wait db rabbitmq
      - name: Build application images
        run: docker compose build db-admin api identity identity-config-reconciler worker model-worker audit-publisher audit-consumer audit-monitor web
      - name: Migrate and provision scoped roles
        run: |
          docker compose run --rm --no-deps db-admin alembic upgrade head
          docker compose run --rm --no-deps db-admin python -m app.db.provision_roles
      - name: Start application
        run: docker compose up -d --no-build --wait --wait-timeout 180 api identity identity-config-reconciler worker model-worker audit-publisher audit-consumer audit-monitor web
      - name: Verify persistent service restart policies
        run: |
          for service in db rabbitmq api identity web worker model-worker audit-publisher audit-consumer audit-monitor identity-config-reconciler; do
            container_id=$(docker compose ps -q "$service")
            test -n "$container_id"
            test "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container_id")" = "unless-stopped"
          done
      - name: Verify identity-dependent readiness and recovery
        run: |
          docker compose stop identity
          for attempt in $(seq 1 15); do
            api_status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health/ready || true)
            web_status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/v1/health/ready || true)
            test "$api_status" = 503 && test "$web_status" = 503 && break
            sleep 1
          done
          test "$api_status" = 503
          test "$web_status" = 503
          docker compose start identity
          docker compose up -d --no-build --wait --wait-timeout 90 identity api web
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health/ready)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/v1/health/ready)" = 200
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local deployment preflight
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/verify_deployment.py
      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: apps/web
        run: npm run test:e2e
      - name: Install distributed benchmark client
        run: python -m pip install 'httpx>=0.28,<1'
      - name: Measure concurrent distributed audit workflows
        env:
          PROCESSMIND_LOAD_TEST: '1'
        run: python scripts/benchmark_distributed.py --size 1000 --users 3 --rounds 2 --output distributed-load-result.json
      - name: Verify quiesced backup and isolated restore
        run: |
          python -m unittest discover -s scripts -p test_backup_local.py
          docker compose stop web api identity identity-config-reconciler worker model-worker
          for attempt in $(seq 1 30); do
            state=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT (SELECT count(*) FROM business.outbox_events WHERE published_at IS NULL) + (SELECT count(*) FROM business.jobs WHERE type = '\''audit'\'' AND status IN ('\''queued'\'', '\''running'\''))"')
            test "$state" = 0 && break
            sleep 2
          done
          test "$state" = 0
          docker compose stop audit-publisher audit-consumer
          python scripts/backup_local.py backup backups/ci-proof
          docker compose exec -T db sh -c 'createdb -U "$POSTGRES_USER" processmind_restore_check'
          docker compose exec -T db sh -c 'pg_restore -U "$POSTGRES_USER" -d processmind_restore_check --no-owner --no-acl' < backups/ci-proof/database.dump
          restore_admin_url="postgresql+psycopg://processmind:${POSTGRES_PASSWORD}@db:5432/processmind_restore_check"
          docker compose run --rm --no-deps -e DATABASE_URL="$restore_admin_url" db-admin python -m app.db.provision_roles
          docker compose run --rm --no-deps -e DATABASE_URL="postgresql+psycopg://processmind_business:${BUSINESS_DB_PASSWORD}@db:5432/processmind_restore_check" api python -m app.db.verify_role_boundary
          docker compose run --rm --no-deps -e DATABASE_URL="postgresql+psycopg://processmind_identity:${IDENTITY_DB_PASSWORD}@db:5432/processmind_restore_check" identity python -m app.db.verify_role_boundary
          source_counts=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT (SELECT count(*) FROM identity.users), (SELECT count(*) FROM business.import_batches), (SELECT count(*) FROM business.audit_runs), (SELECT count(*) FROM business.audit_findings)"')
          restored_counts=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d processmind_restore_check -Atqc "SELECT (SELECT count(*) FROM identity.users), (SELECT count(*) FROM business.import_batches), (SELECT count(*) FROM business.audit_runs), (SELECT count(*) FROM business.audit_findings)"')
          test "$source_counts" = "$restored_counts"
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d processmind_restore_check -Atqc "SELECT private_storage_key FROM business.import_batches"' > backups/ci-proof/restore-keys.txt
          restore_volume="processmind-ci-uploads-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$restore_volume"
          trap 'docker volume rm "$restore_volume" >/dev/null' EXIT
          docker run --rm -v "$restore_volume:/restore" -v "$PWD/backups/ci-proof:/backup:ro" postgres:16-alpine tar -xf /backup/uploads.tar -C /restore
          api_image=$(docker compose images -q api)
          test -n "$api_image"
          docker run --rm -v "$restore_volume:/restore:ro" -v "$PWD/backups/ci-proof:/backup:ro" -v "$PWD/scripts:/verification:ro" --entrypoint python "$api_image" /verification/verify_restored_uploads.py /backup/uploads.tar /restore /backup/restore-keys.txt
          echo "Backup and isolated restore verified"
      - name: Save distributed load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-load-result
          path: distributed-load-result.json
          if-no-files-found: ignore
      - name: Show Compose status on failure
        if: failure()
        run: docker compose ps --all
      - name: Stop disposable stack
        if: always()
        run: docker compose down
  broker-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: processmind_test
          POSTGRES_USER: processmind
          POSTGRES_PASSWORD: processmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U processmind -d processmind_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: processmind_test
          RABBITMQ_DEFAULT_PASS: processmind_test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://processmind:processmind_test@localhost:5432/processmind_test
      RABBITMQ_HOST: localhost
      RABBITMQ_USER: processmind_test
      RABBITMQ_PASSWORD: processmind_test
      RUN_DB_TESTS: '1'
      RUN_BROKER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
        working-directory: apps/api
      - run: alembic upgrade head
        working-directory: apps/api
      - run: pytest -q tests/test_audit_broker_recovery.py
        working-directory: apps/api
