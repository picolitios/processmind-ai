services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-processmind}
      POSTGRES_USER: ${POSTGRES_USER:-processmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-processmind}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-processmind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-processmind}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      APP_ENV: ${APP_ENV:-local}
      AUTH_HASH_KEY: ${AUTH_HASH_KEY:-local-only-replace-before-production}
      UPLOAD_DIR: /data/uploads
      AUDIT_DISPATCH_MODE: broker
      BUSINESS_AUTH_MODE: identity
      IDENTITY_INTERNAL_URL: http://identity:8000
    volumes:
      - upload_data:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
  identity:
    build: ./apps/api
    command: ["uvicorn", "app.identity_app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-processmind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-processmind}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      APP_ENV: ${APP_ENV:-local}
      AUTH_HASH_KEY: ${AUTH_HASH_KEY:-local-only-replace-before-production}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: ./apps/api
    command: ["python", "-m", "app.features.ingestion.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-processmind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-processmind}
      UPLOAD_DIR: /data/uploads
      AUTH_HASH_KEY: ${AUTH_HASH_KEY:-local-only-replace-before-production}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      AUDIT_DISPATCH_MODE: broker
    volumes:
      - upload_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
  audit-publisher:
    build: ./apps/api
    command: ["python", "-m", "app.features.audit.broker", "publish"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-processmind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-processmind}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-processmind}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me-local}
      AUTH_HASH_KEY: ${AUTH_HASH_KEY:-local-only-replace-before-production}
      AUDIT_DISPATCH_MODE: broker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  audit-consumer:
    build: ./apps/api
    command: ["python", "-m", "app.features.audit.broker", "consume"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-processmind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-processmind}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-processmind}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me-local}
      AUTH_HASH_KEY: ${AUTH_HASH_KEY:-local-only-replace-before-production}
      AUDIT_DISPATCH_MODE: broker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  postgres_data:
  upload_data:
  rabbitmq_data:
